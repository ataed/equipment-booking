name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # tests/setup-admin-env.js falls back to this, but the fallback should not
      # be the only place CI learns the project id. admin.js and
      # initializeTestEnvironment must agree on it or they are two databases.
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: almanar-booking-dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Same cache as the e2e job. Without it this job downloads the emulator
      # jars on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm ci
      - run: npm run test:emulator

  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USE_EMULATORS: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: almanar-booking-dev.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: almanar-booking-dev
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: almanar-booking-dev.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: demo-app-id
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
